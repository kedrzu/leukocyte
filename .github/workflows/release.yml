# Cuts a release from main: builds, signs and notarizes Leukocyte.app, then creates the tag v<version>
# and its GitHub Release with the zip, and pushes the cask to kedrzu/homebrew-tap. The version is
# Cargo.toml's. A dry run does everything up to notarization and uploads the zip and the cask as
# artifacts; it never creates a tag, a Release or a tap commit. Steps: docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and notarize only; publish nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and both targets (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Read the version from Cargo.toml
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | plutil -extract packages.0.version raw -o - -)"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # Refuses an existing tag v<version> (dry run or not) and a ref other than main (unless dry run).
      - name: Preflight
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-preflight.sh "$VERSION" "$GITHUB_REF" "$DRY_RUN"

      - name: Build, sign and notarize Leukocyte.app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/bundle.sh --notarize

      - name: Render the cask
        run: scripts/cask.sh

      - name: Upload the zip and the cask (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: Leukocyte-${{ steps.version.outputs.version }}
          path: |
            target/bundle/Leukocyte-${{ steps.version.outputs.version }}.zip
            target/bundle/leukocyte.rb
          if-no-files-found: error

      # Everything below publishes. Each step runs only when every step above succeeded (an `if:`
      # without a status function implies `success()`), so the tag never exists before notarization
      # passed, and never in a dry run.
      - name: Create the tag and the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Again right before tagging: `gh release create` would reuse a tag pushed since the
          # preflight instead of failing.
          scripts/release-preflight.sh "$VERSION" "$GITHUB_REF" "$DRY_RUN"
          gh release create "v$VERSION" "target/bundle/Leukocyte-$VERSION.zip" \
            --target "$GITHUB_SHA" --generate-notes --title "leukocyte $VERSION"

      - name: Check out kedrzu/homebrew-tap
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v4
        with:
          repository: kedrzu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Push the cask to kedrzu/homebrew-tap
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p Casks
          cp ../target/bundle/leukocyte.rb Casks/leukocyte.rb
          git add Casks/leukocyte.rb
          git commit -m "leukocyte $VERSION"
          git push origin HEAD
