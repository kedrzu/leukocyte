[package]
name = "leukocyte"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A lightweight macOS daemon that kills stale dev processes left by AI agents, with per-repo Lua detectors"
license = "MIT"
repository = "https://github.com/kedrzu/leukocyte"
readme = "README.md"

[dependencies]
libc = "0.2"
libproc = "0.15"
mach2 = "0.7"
mlua = { version = "0.12", features = ["luau"] }
notify = "9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
